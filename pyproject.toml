[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "l3p2-mushroom-ml"
version = "0.1.0"
description = "Schoolproject: binaire classificatie van paddenstoelen"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2,<3",
    "numpy>=1.26,<3",
    "matplotlib>=3.8,<4",
    "scikit-learn>=1.5,<2",
    "joblib>=1.4,<2",
    "streamlit>=1.40,<2",
]

[tool.setuptools]
packages = ["src"]
